name: Checks
run-name: ${{ gitea.actor }} is running checks 🚀
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node is kept available for vitest and Next's build tooling, and matches
      # the runtime image (MCP servers are spawned as node/npx child processes).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun (1.4 / Rust build)
        uses: oven-sh/setup-bun@v2
        with:
          token: ${{ secrets.GHCR_ACCESS_TOKEN }}
          bun-version: 1.4.x

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo build outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bunx (not `bun run`) sidesteps a Gitea-runner quirk where `bun run`
      # doesn't add node_modules/.bin to PATH, breaking the `turbo` script entry.
      - name: Lint (biome ci)
        run: bunx biome ci .

      - name: Type-check (turbo)
        run: bunx turbo check-types

      - name: Build (turbo)
        run: bunx turbo build

      - name: Test (turbo)
        run: bunx turbo test
