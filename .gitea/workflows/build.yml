name: Builder
run-name: ${{ gitea.actor }} is building MetaMCP 🚀
on:
  workflow_dispatch:
    inputs:
      push_to_github:
        description: 'Also push to GitHub Container Registry'
        required: false
        default: false
        type: boolean
      custom_tags:
        description: 'Custom tags for the image (comma-separated, e.g., 0.3.4,0.3)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

      - name: Build MetaMCP image
        env:
          REPOSITORY_IMAGE: ${{ vars.REPOSITORY_IMAGE }}
        run: docker build -f docker/dockerfiles/Dockerfile -t "${REPOSITORY_IMAGE}" .

      - name: Push MetaMCP to Gitea
        env:
          REPOSITORY_IMAGE: ${{ vars.REPOSITORY_IMAGE }}
        run: docker push "${REPOSITORY_IMAGE}"

      - name: Login to GitHub Container Registry
        if: ${{ github.event.inputs.push_to_github == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_ACCESS_TOKEN }}

      - name: Mirror MetaMCP to GitHub
        if: ${{ github.event.inputs.push_to_github == 'true' }}
        env:
          SOURCE: ${{ vars.REPOSITORY_IMAGE }}
          TARGET: ${{ vars.REPOSITORY_IMAGE_PUBLIC }}
        run: |
          docker tag "${SOURCE}" "${TARGET}"
          docker push "${TARGET}"

      - name: Push custom tags to GitHub
        if: ${{ github.event.inputs.push_to_github == 'true' && github.event.inputs.custom_tags != '' }}
        env:
          SOURCE: ${{ vars.REPOSITORY_IMAGE }}
          REPOSITORY_IMAGE_PUBLIC: ${{ vars.REPOSITORY_IMAGE_PUBLIC }}
          CUSTOM_TAGS: ${{ github.event.inputs.custom_tags }}
        run: |
          BASE_IMAGE=$(echo "${REPOSITORY_IMAGE_PUBLIC}" | cut -d':' -f1)
          IFS=',' read -ra TAGS <<< "${CUSTOM_TAGS}"
          for TAG in "${TAGS[@]}"; do
            TAG=$(echo "$TAG" | xargs)
            if [ -n "$TAG" ]; then
              echo "Tagging and pushing: ${BASE_IMAGE}:${TAG}"
              docker tag "${SOURCE}" "${BASE_IMAGE}:${TAG}"
              docker push "${BASE_IMAGE}:${TAG}"
            fi
          done
