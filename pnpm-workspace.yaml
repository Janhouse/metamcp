packages:
  - "apps/*"
  - "packages/*"

# Supply-chain hardening (see also notes below). pnpm 10.16+ honours these.
# Settings duplicated from .npmrc because some of pnpm 10.x's newer settings
# (notably minimumReleaseAgeStrict) are only read from pnpm-workspace.yaml.
#
# minimumReleaseAge — in MINUTES (10080 = 7 days). Refuses to install
# packages younger than the window so freshly-trojaned releases of popular
# packages can be yanked before they land in our lockfile.
#
# minimumReleaseAgeStrict — when false, pnpm picks the most recent version
# that DOES meet the gate instead of aborting the whole `pnpm update --latest`
# run if any single dep's latest release is too new.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: false
