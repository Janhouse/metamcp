[install]
# Refuse to install npm releases younger than this many SECONDS.
# 604800 = 7 days. Mitigates supply-chain attacks where a compromised
# maintainer publishes a malicious version: a 7-day cool-down gives the
# ecosystem time to spot and yank bad releases before we pull them in.
# Bun uses seconds (npm uses days, pnpm uses minutes — this replaces the
# pnpm-workspace.yaml / .npmrc minimum-release-age=10080 minutes setting).
minimumReleaseAge = 604800

# Add internal/trusted scopes here if any ever need to bypass the gate.
# Note: excluding a package does NOT exclude its platform-specific binary
# sub-packages (e.g. @biomejs/cli-linux-x64), so excluding e.g. @biomejs/biome
# while it's <7d old yields a main/binary version mismatch. Prefer letting the
# gate pick a mature version over excluding.
#
# The @next/swc-* family MUST therefore be listed alongside "next": matching is
# exact-name only (no globs) and they are optionalDependencies, so a quarantined
# swc build is silently dropped from the lockfile rather than failing. `next
# build` then falls back to downloading SWC through npm at build time — which
# works on the checks runner but breaks the Docker image, where bun is the only
# package manager present.
minimumReleaseAgeExcludes = [
  "next",
  "@next/env",
  "@next/swc-darwin-arm64",
  "@next/swc-darwin-x64",
  "@next/swc-linux-arm64-gnu",
  "@next/swc-linux-arm64-musl",
  "@next/swc-linux-x64-gnu",
  "@next/swc-linux-x64-musl",
  "@next/swc-win32-arm64-msvc",
  "@next/swc-win32-x64-msvc",
  "eslint-config-next",
  "@next/eslint-plugin-next",
]
